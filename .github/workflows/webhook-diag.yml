name: Webhook signature diagnostic

# TEMPORARY diagnostic for the Twilio webhook 403s — sends a correctly signed
# synthetic webhook (no link, no media: the handler ACKs before writing
# anything, zero side effects) to production (old code) and the PR preview
# (candidate-URL fix). Remove after the outage investigation closes.

on:
  push:
    branches: [claude/bespoke-shadcn-migration-dn3qjw]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Signed probe against prod and preview
        env:
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          if [ -z "$TWILIO_AUTH_TOKEN" ]; then
            echo "::error::Missing TWILIO_AUTH_TOKEN repo secret"; exit 1
          fi
          node - <<'EOF'
          const crypto = require("crypto");
          const TOKEN = process.env.TWILIO_AUTH_TOKEN;
          const params = { From: "+15005550006", Body: "webhook diagnostic (no link)" };
          const OLD = "https://tiktok-helper.vercel.app/api/twilio/webhook";
          const NEW = "https://www.planning-friend.com/api/twilio/webhook";
          const sign = (url) => {
            const sorted = Object.keys(params).sort().map((k) => k + params[k]).join("");
            return crypto.createHmac("sha1", TOKEN).update(url + sorted).digest("base64");
          };
          const post = (url, sig, redirect) => fetch(url, {
            method: "POST",
            redirect,
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "X-Twilio-Signature": sig,
            },
            body: new URLSearchParams(params).toString(),
          });
          (async () => {
            // 1. Does the old vercel.app domain redirect POSTs to the custom domain?
            let r = await post(OLD, sign(OLD), "manual");
            console.log(`old domain, no follow: HTTP ${r.status} Location=${r.headers.get("location")}`);
            // 2. Twilio's exact scenario: request lands on the custom domain,
            //    signature computed over the custom-domain URL.
            r = await post(NEW, sign(NEW), "manual");
            console.log(`custom domain, signed over custom URL: HTTP ${r.status}`);
            // 3. Control: custom domain, signature computed over the OLD URL —
            //    matches what the old code derives from NEXT_PUBLIC_APP_URL.
            r = await post(NEW, sign(OLD), "manual");
            console.log(`custom domain, signed over old URL: HTTP ${r.status}`);
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF
